# SwiftLint Configuration for BudgetMeter iOS
# Install: brew install swiftlint
# Run: swiftlint lint

# ============================================================================
# INCLUDED/EXCLUDED PATHS
# ============================================================================

included:
  - budgetmeter.ios
  - budgetmeter.iosTests

excluded:
  - Pods
  - Carthage
  - .build
  - DerivedData
  - "*.generated.swift"
  - budgetmeter.ios/Preview Content

# ============================================================================
# DISABLED RULES
# ============================================================================

disabled_rules:
  - trailing_whitespace          # Too noisy
  - todo                         # Allow TODO comments
  - opening_brace                # Conflicts with some SwiftUI patterns
  - multiple_closures_with_trailing_closure  # Common in SwiftUI

# ============================================================================
# OPT-IN RULES
# ============================================================================

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# ============================================================================
# RULE CONFIGURATIONS
# ============================================================================

# Line Length
line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

# File Length
file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

# Type Body Length
type_body_length:
  warning: 300
  error: 500

# Function Body Length
function_body_length:
  warning: 50
  error: 100

# Function Parameter Count
function_parameter_count:
  warning: 6
  error: 8

# Cyclomatic Complexity
cyclomatic_complexity:
  warning: 15
  error: 25

# Nesting
nesting:
  type_level:
    warning: 3
    error: 5
  function_level:
    warning: 4
    error: 6

# Identifier Name
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - k
    - n
    - to
    - at
    - by
    - db
    - ok
    - on

# Type Name
type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60
  excluded:
    - ID

# Large Tuple
large_tuple:
  warning: 4
  error: 6

# Vertical Whitespace
vertical_whitespace:
  max_empty_lines: 2

# Trailing Comma
trailing_comma:
  mandatory_comma: false

# Multiline Arguments
multiline_arguments:
  only_enforce_after_first_closure_on_first_line: true

# Modifier Order
modifier_order:
  preferred_modifier_order:
    - acl
    - setterACL
    - override
    - dynamic
    - mutating
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

# Implicit Return
implicit_return:
  included:
    - closure
    - getter

# Force Unwrapping
force_unwrapping:
  severity: warning

# ============================================================================
# CUSTOM RULES
# ============================================================================

custom_rules:
  # Discourage print statements in production code
  no_print_statements:
    name: "No Print Statements"
    regex: "\\bprint\\s*\\("
    message: "Remove print statements before committing. Use proper logging instead."
    severity: warning
    match_kinds:
      - identifier
    excluded: ".*Tests?\\.swift$"

  # Enforce MARK comments format
  mark_format:
    name: "MARK Format"
    regex: "// MARK:[^ -]|// MARK: -[^ ]"
    message: "Use '// MARK: - Section Name' format with proper spacing."
    severity: warning

  # Discourage NSLog
  no_nslog:
    name: "No NSLog"
    regex: "\\bNSLog\\s*\\("
    message: "Use print() or a proper logging framework instead of NSLog."
    severity: warning

  # Ensure MainActor on ViewModels
  viewmodel_main_actor:
    name: "ViewModel MainActor"
    regex: "class\\s+\\w+ViewModel\\s*:\\s*ObservableObject(?!.*@MainActor)"
    message: "ViewModels should be marked with @MainActor."
    severity: warning

# ============================================================================
# REPORTER
# ============================================================================

reporter: "xcode"  # Options: xcode, json, csv, emoji, sonarqube, markdown, github-actions-logging
